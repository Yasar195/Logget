[package]
name = "logget"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.1", features = ["macros"] }
bollard = "0.21.1"
futures-util = "0.3.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39.6"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1.17"
tower-http = { version = "0.6.2", features = ["cors"] }
