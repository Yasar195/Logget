name: Release Linux Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and publish logget for Linux
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/logget dist/logget-linux-amd64
          chmod +x dist/logget-linux-amd64
          tar -czf dist/logget-linux-amd64.tar.gz -C dist logget-linux-amd64
          sha256sum dist/logget-linux-amd64.tar.gz > dist/logget-linux-amd64.tar.gz.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/logget-linux-amd64
            dist/logget-linux-amd64.tar.gz
            dist/logget-linux-amd64.tar.gz.sha256
          draft: false
          prerelease: false
